<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Headshots — before (main)</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: linear-gradient(145deg, #f7e9ef, #efe8f7 40%, #e8eef8);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #1d1d1f;
  }
  .window {
    width: min(620px, 96vw); min-height: 560px; background: #fff;
    border-radius: 12px; box-shadow: 0 24px 60px rgba(0,0,0,.18);
    padding: 20px; display: flex; flex-direction: column; gap: 16px;
  }
  .drop {
    height: 92px; border: 2px dashed rgba(0,0,0,.25); border-radius: 12px;
    display: grid; place-items: center; text-align: center; background: rgba(0,0,0,.02);
  }
  .drop h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .drop p { margin: 4px 0 0; font-size: 12px; color: #6e6e73; }
  .grid { display: grid; grid-template-columns: 72px 1fr; gap: 12px 14px; align-items: center; }
  .grid label { color: #6e6e73; text-align: right; }
  .row { display: flex; gap: 10px; align-items: center; }
  input[type="text"], select { border: 1px solid #d2d2d7; border-radius: 6px; padding: 4px 8px; }
  .spacer { flex: 1; }
  .controls { display: flex; gap: 8px; align-items: center; margin-top: auto; }
  button {
    border: 1px solid #d2d2d7; background: #f5f5f7; border-radius: 6px;
    padding: 6px 12px; font: inherit; color: #1d1d1f;
  }
  button.primary { background: #0071e3; color: #fff; border-color: #0071e3; }
  button:disabled { opacity: .45; }
  .note { font-size: 12px; color: #6e6e73; }
</style>
</head>
<body>
  <main class="window" aria-label="Headshots before polish">
    <section class="drop">
      <div>
        <h2>Drop a folder of photos</h2>
        <p>originals are never modified</p>
      </div>
    </section>
    <section class="grid">
      <label>Shape</label>
      <select><option>4:5 — standard headshot</option></select>
      <label>Width</label>
      <div class="row"><input type="text" value="1600" style="width:70px"><span class="note">px — 1600 × 2000</span></div>
      <label>Crop</label>
      <div class="row"><input type="range" min="70" max="130" value="100" style="width:200px"><span class="note">standard</span></div>
      <label></label>
      <div>
        <div><label><input type="checkbox"> Black and white</label></div>
        <div style="margin-top:6px"><label><input type="checkbox" checked> Group by person afterwards</label></div>
        <p class="note" style="margin:6px 0 0">Downloads a 37 MB matching model the first time.</p>
      </div>
    </section>
    <div class="spacer"></div>
    <div class="controls">
      <span class="spacer"></span>
      <button class="primary" disabled>Polish</button>
    </div>
  </main>
</body>
</html>
